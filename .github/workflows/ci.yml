name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.12"
      - name: Install CAD runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglu1-mesa
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Portable geometry and export tests
        run: uv run --no-sync pytest -q -m "not native and not reference"
      - name: Build and inspect distributions
        run: |
          uv build
          uv run --no-sync python tools/check_distributions.py dist
      - name: Installed wheel smoke test
        run: |
          uv venv --python 3.12 .local/wheel-smoke
          uv pip install --python .local/wheel-smoke/bin/python dist/*.whl
          cd .local
          env -u PYTHONPATH wheel-smoke/bin/python -m cargo_grid --version
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid --help
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --build-width-mm 150 --build-depth-mm 150 --build-height-mm 50 --no-stl --output wheel-job
          env -u PYTHONPATH wheel-smoke/bin/cargo-grid part --family vertical-tile-bracket --cells 1 2 --build-width-mm 350 --build-depth-mm 320 --build-height-mm 325 --bambu --material PETG PETG "#637b70" --nozzle 0.4 --layer-height 0.2 --no-stl --output wheel-bracket
          env -u PYTHONPATH wheel-smoke/bin/python -c 'import json; p=json.load(open("wheel-bracket/manifest.json")); d=p["designs"][0]; assert (d["parameters"]["nx"],d["parameters"]["ny"]) == (1,2); assert d["recommended_print_orientation"]["applied_to_exports"]["bambu_3mf"]; assert p["export"]["plates"][0]["items"][0]["source_to_project_transform"]["rotation_x_degrees"] == 135'
